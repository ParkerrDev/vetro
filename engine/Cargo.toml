# The glass model, in two crates:
#   glass-core  pure computation, no unsafe code, no I/O: the lens, the options,
#               the panes, the schedule of the passes, the shaders' text, and the
#               modules later milestones wire in (motion, shapes, materials)
#   glass-ffi   a static library behind a C ABI, the only place unsafe code is
#               allowed; the C++ plugin links it and keeps every Hyprland and GL call
[workspace]
members = ["crates/glass-core", "crates/glass-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
glass-core = { path = "crates/glass-core", version = "0.1.0" }
libm = "0.2"
syn = { version = "2", default-features = false, features = ["full", "parsing", "derive", "printing"] }
thiserror = "2"

# Power of Ten lint tables (the power-of-ten-rust skill). unsafe_code is denied
# for the workspace; glass-core forbids it outright, and the one module of
# glass-ffi that has to cross the C boundary expects it, with a reason.
[workspace.lints.rust]
unsafe_code = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
expect_used = "warn"
unreachable = "warn"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
mem_forget = "deny"
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# The plugin is a library inside the compositor: a panic would take the whole
# session down, and nothing may unwind into C++, so a panic is an abort.
[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
debug = "line-tables-only"
